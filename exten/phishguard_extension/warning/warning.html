<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CYBERSHIELD — Warning</title>
  <link rel="stylesheet" href="warning.css">
</head>
<body>
  <div class="warning-layout">
    <div class="warning-card">
      <!-- Icon -->
      <div class="warning-icon-wrap" id="warning-icon-wrap">
        <div class="warning-icon">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
            <line x1="12" y1="9" x2="12" y2="13"/>
            <line x1="12" y1="17" x2="12.01" y2="17"/>
          </svg>
        </div>
      </div>

      <!-- Content -->
      <h1 class="warning-title" id="warning-title">Threat Detected</h1>
      <p class="warning-subtitle" id="warning-subtitle">CYBERSHIELD has blocked this page for your safety</p>

      <!-- Verdict badge -->
      <div class="warning-verdict" id="warning-verdict"></div>

      <!-- URL -->
      <div class="warning-url-wrap">
        <div class="warning-url-label">Blocked URL</div>
        <div class="warning-url" id="warning-url">—</div>
      </div>

      <!-- Reason -->
      <div class="warning-reason-wrap" id="warning-reason-wrap" style="display:none">
        <div class="warning-reason-label">Why was this blocked?</div>
        <div class="warning-reason" id="warning-reason"></div>
      </div>

      <!-- Flags -->
      <div class="warning-flags" id="warning-flags" style="display:none"></div>

      <!-- Actions -->
      <div class="warning-actions">
        <button class="btn-safe" id="btn-go-back">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
          Go Back to Safety
        </button>
        <button class="btn-proceed" id="btn-proceed" style="display:none">
          Proceed Anyway →
        </button>
      </div>

      <!-- Disclaimer -->
      <p class="warning-disclaimer">
        This page was flagged by CYBERSHIELD's detection engine.
        If you believe this is a false positive, you can provide feedback through the dashboard.
      </p>
    </div>

    <!-- Branding -->
    <div class="warning-branding">
      <img src="../assets/logo.svg" alt="" width="20" height="20">
      <span>Protected by CYBERSHIELD</span>
    </div>
  </div>

  <script src="warning.js"></script>
</body>
</html>
