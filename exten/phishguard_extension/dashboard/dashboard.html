<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CYBERSHIELD — Dashboard</title>
  <link rel="stylesheet" href="dashboard.css">
</head>
<body>
  <div class="dash-layout">
    <!-- Sidebar -->
    <aside class="dash-sidebar">
      <div class="sidebar-brand">
        <img src="../assets/logo.svg" alt="CYBERSHIELD" width="32" height="32">
        <div>
          <div class="sidebar-title">CYBERSHIELD</div>
          <div class="sidebar-subtitle">Security Dashboard</div>
        </div>
      </div>
      <nav class="sidebar-nav">
        <a class="sidebar-link active" data-section="overview">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
          Overview
        </a>
        <a class="sidebar-link" data-section="history">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
          History
        </a>
      </nav>
      <div class="sidebar-footer">
        <button class="sidebar-btn" id="btn-open-popup" title="Open extension popup">Extension Popup</button>
        <button class="sidebar-btn" id="btn-open-options" title="Settings">Settings</button>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="dash-main">
      <!-- Top bar -->
      <header class="dash-topbar">
        <div>
          <h1 class="dash-page-title" id="page-title">Overview</h1>
          <div class="dash-connection" id="dash-connection">
            <span class="status-dot" id="dash-status-dot"></span>
            <span id="dash-status-text">Checking…</span>
          </div>
        </div>
        <div class="topbar-actions">
          <span class="topbar-updated" id="last-updated"></span>
          <button class="btn-secondary" id="btn-refresh">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
            Refresh
          </button>
        </div>
      </header>

      <!-- Overview Section -->
      <section class="dash-section" id="section-overview">
        <!-- Metric Cards -->
        <div class="metric-grid" id="metric-grid">
          <!-- dynamically populated -->
        </div>

        <!-- Charts Row -->
        <div class="chart-row">
          <div class="chart-card" id="chart-category">
            <div class="chart-title">Scan Distribution</div>
            <div class="chart-body" id="chart-category-body"></div>
            <div class="chart-legend" id="chart-category-legend"></div>
          </div>
          <div class="chart-card" id="chart-daily">
            <div class="chart-title">Daily Activity (Last 14 Days)</div>
            <div class="chart-body" id="chart-daily-body"></div>
          </div>
        </div>

        <!-- Performance Metrics -->
        <div class="perf-grid" id="perf-grid"></div>
      </section>

      <!-- History Section -->
      <section class="dash-section hidden" id="section-history">
        <!-- Filters -->
        <div class="filter-bar" id="filter-bar">
          <input type="text" class="filter-input" id="filter-search" placeholder="Search URLs, content…">
          <select class="filter-select" id="filter-risk">
            <option value="">All Risk Levels</option>
            <option value="safe">Safe</option>
            <option value="suspicious">Suspicious</option>
            <option value="phishing">Phishing</option>
            <option value="malware">Malware</option>
          </select>
          <select class="filter-select" id="filter-source">
            <option value="">All Sources</option>
            <option value="browser">Browser</option>
            <option value="email">Email</option>
            <option value="whatsapp">WhatsApp</option>
            <option value="manual">Manual</option>
            <option value="attachment">Attachment</option>
          </select>
          <input type="date" class="filter-input" id="filter-date-from" title="From date">
          <input type="date" class="filter-input" id="filter-date-to" title="To date">
          <button class="btn-secondary" id="btn-apply-filters">Apply</button>
          <button class="btn-ghost" id="btn-clear-filters">Clear</button>
        </div>

        <!-- Action bar -->
        <div class="history-actions">
          <span class="history-count" id="history-count">—</span>
          <div class="history-action-btns">
            <button class="btn-secondary" id="btn-export-csv">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
              Export CSV
            </button>
            <button class="btn-danger-ghost" id="btn-clear-history">Clear All</button>
          </div>
        </div>

        <!-- Table -->
        <div class="table-container">
          <table class="history-table" id="history-table">
            <thead>
              <tr>
                <th style="width:40px"></th>
                <th>URL / Content</th>
                <th>Type</th>
                <th>Source</th>
                <th>Verdict</th>
                <th>Risk</th>
                <th>Confidence</th>
                <th>Time</th>
                <th style="width:60px">Actions</th>
              </tr>
            </thead>
            <tbody id="history-tbody"></tbody>
          </table>
        </div>

        <!-- Pagination -->
        <div class="pagination" id="pagination"></div>
      </section>
    </main>
  </div>

  <!-- Detail Modal / Drawer -->
  <div class="detail-modal-overlay" id="detail-modal-overlay">
    <div class="detail-modal" id="detail-modal">
      <div class="detail-modal-header">
        <h2 class="detail-modal-title" id="detail-modal-title">Scan Detail</h2>
        <button class="detail-modal-close" id="detail-modal-close" title="Close">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div class="detail-modal-body" id="detail-modal-body">
        <!-- Populated dynamically -->
      </div>
    </div>
  </div>

  <script src="../shared/api.js"></script>
  <script src="../shared/storage.js"></script>
  <script src="../shared/ui.js"></script>
  <script src="../shared/theme.js"></script>
  <script src="dashboard.js"></script>
</body>
</html>
